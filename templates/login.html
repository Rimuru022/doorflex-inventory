<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="https://images.squarespace-cdn.com/content/v1/697927f21da39d20b8c643e3/982c2a3b-e83e-47fa-b327-88a997fb6c65/38F18C26-0AA4-4042-9B66-5B19ED19078A.PNG?format=100w">
<title>DoorFlex Inventory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --color-surface:oklch(0.995 0.003 50);
  --color-border:oklch(0.88 0.006 50);
  --color-text:oklch(0.15 0.01 50);
  --color-muted:oklch(0.55 0.012 50);
  --color-accent:oklch(0.62 0.16 55);
  --color-accent-hover:oklch(0.57 0.17 55);
  --color-nav-bg:oklch(0.14 0.012 50);
  --text-sm:0.8125rem;
  --text-base:0.9375rem;
  --text-lg:1.125rem;
  --space-md:1rem;
  --space-lg:1.5rem;
  --space-xl:2rem;
  --space-2xl:3rem;
  --radius:0;
  font-family:'Public Sans',-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
}
.login-page{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--color-nav-bg);flex-direction:column;gap:var(--space-xl)}
.login-brand{display:flex;align-items:center;gap:0.75rem}
.login-brand h1{font-weight:800;font-size:1.5rem;letter-spacing:0.06em;color:#fff;text-transform:uppercase}
.login-brand span{font-weight:400;font-size:0.875rem;color:oklch(0.65 0.01 50);letter-spacing:0.02em}
.login-card{background:var(--color-surface);border-radius:var(--radius);padding:var(--space-2xl);width:380px;box-shadow:0 8px 30px oklch(0 0 0 / 0.15)}
label{display:block;font-size:var(--text-sm);font-weight:500;color:var(--color-text);margin-bottom:0.3rem}
input{width:100%;padding:0.55rem 0.7rem;border:1px solid var(--color-border);border-radius:var(--radius);
  font-size:var(--text-sm);font-family:inherit;color:var(--color-text);background:var(--color-surface);
  transition:border-color 0.12s,box-shadow 0.12s;}
input:focus{outline:none;border-color:var(--color-accent);box-shadow:0 0 0 2px oklch(0.62 0.16 55 / 0.2)}
.btn{display:inline-flex;align-items:center;justify-content:center;
  padding:0.55rem 1rem;border-radius:var(--radius);font-size:var(--text-sm);font-weight:500;
  border:none;cursor:pointer;width:100%;margin-top:var(--space-md);
  background:var(--color-accent);color:#fff;transition:background 0.12s;letter-spacing:0.02em;}
.btn:hover{background:var(--color-accent-hover)}
.error{color:oklch(0.55 0.18 30);font-size:var(--text-sm);margin-bottom:var(--space-md);text-align:center}
.demo-hint{margin-top:var(--space-md);font-size:var(--text-sm);color:var(--color-muted);text-align:center}
.demo-hint a{color:var(--color-accent)}
.login-card{animation:card-in 320ms cubic-bezier(0.22,1,0.36,1) both}
@keyframes card-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.login-card{animation:none}}
::selection{background:var(--color-accent);color:#fff}
</style>
</head>
<body class="login-page">
  <div class="login-brand">
    <h1>DOORFLEX</h1>
    <span>Inventory</span>
  </div>
  <div class="login-card">
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="post" action="/login">
      <label>Password</label>
      <input type="password" name="password" autofocus{% if demo_password %} value="{{ demo_password }}"{% endif %}>
      <button class="btn" type="submit">Sign in</button>
    </form>
    {% if demo_password %}<p class="demo-hint">Demo público · contraseña <strong>{{ demo_password }}</strong> · <a href="/demo">recorrido guiado</a></p>{% endif %}
  </div>
</body>
</html>
