[project]
name = "doorflexinventorysystem"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.139.2",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "openai>=3.3.1",
    "openpyxl>=3.1.5",
    "pdfplumber>=0.11.10",
    "pillow>=10.2.0",
    "pypdf>=6.14.2",
    "python-multipart>=0.0.32",
    "pywebpush>=2.4.0",
    "reportlab>=4.2.0",
    "requests>=2.32.0",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
